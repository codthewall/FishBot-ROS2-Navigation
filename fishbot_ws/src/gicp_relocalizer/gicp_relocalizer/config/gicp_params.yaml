gicp_relocalizer:
  ros__parameters:
    global_frame: "map"
    odom_frame: "odom"
    base_frame: "base_link"
    laser_frame: "laser_link"
    scan_topic: "/scan"
    map_topic: "/map"
    
    # 新：是否使用新的 /relocalize 服务（推荐：true）
    # true: 使用新的 relocalize 服务，直接更新位姿，无需重启轨迹
    # false: 使用传统方法（重启轨迹），不推荐
    use_relocalize_service: true
    
    icp:
      max_correspondence_distance: 1.5   # 增大以容忍更大误差
      maximum_iterations: 50
      transformation_epsilon: 0.0001
      euclidean_fitness_epsilon: 0.001
    
    init_search:
      radius: 10.0         # 增大搜索范围（米）
      resolution: 0.5      # 搜索步长（米）
      angles: [-3.14, -2.36, -1.57, -0.79, 0.0, 0.79, 1.57, 2.36, 3.14]  # 8个方向
    
    loop_closure:
      enabled: true
      min_travel_distance: 2.0      # 增大：每移动2米才检查
      min_time_seconds: 15.0        # 增大：每15秒最多检查一次
      fitness_threshold: 0.05
      pose_diff_threshold: 0.8      # 只有偏移>0.8米才触发
    
    # 恢复阈值（代码中硬编码使用了这个参数）
    recovery:
      threshold: 0.8  # 严重偏离阈值
    
    voxel_leaf_size: 0.05
    
    cartographer_config_dir: "/home/syf/chapt9/fishbot_ws/src/fishbot_navigation2/config"
    cartographer_config_basename: "fishbot_2d_localization.lua"
    
    # 新：分层 SAC-IA 粗定位参数（推荐：true）
    # true: 使用分层 SAC-IA + GICP（快速，~0.5-1秒）
    # false: 使用传统网格搜索 + ICP（慢，~2-5分钟）
    use_hierarchical_sacia: true
    sacia:
      fitness_threshold: 0.05   # SAC-IA 得分阈值（越小越严格，原为0.1）